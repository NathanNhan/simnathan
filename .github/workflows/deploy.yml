name: Deploy to FTP

on:
  push:
    branches:
      - main # Hoặc 'master' tùy thuộc vào nhánh chính của bạn

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Thư mục đích trên server (ví dụ: public_html hoặc www)
          remote-dir: public_html/wp-content/themes/travelme
          debug: true
